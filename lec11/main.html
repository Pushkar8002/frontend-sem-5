<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box Model Example</title>

   <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>CSS Box Model - CSE Student Example</h2>

    <p>
        The CSS box model is essentially a box that wraps around every HTML element.
    </p>

    <div class="box">
        <h3>Computer Science & Engineering</h3>

        <p>
            CSE students learn programming, data structures, algorithms,
            databases, web development, artificial intelligence,
            and cloud computing.
        </p>
    </div>

</body>
