<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List styles in CSS</title>
    <style>
        .html1{
            margin-top: 0px;
            color: red;
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif;
            padding: 10px;
            border: 2px solid black;
        }
        .Css1{
            margin: 20px;
            margin-top: 50px;
            color: blue;
            font-size: 20px;
            padding: 100px;
            font-family: Arial, Helvetica, sans-serif;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="html1">list of departments
    <ul>
        <li>Computer Science</li>
        <li>Mathematics</li>
        <li>Physics</li>
    </ul>
    </div>
    <div class="Css1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dicta placeat, natus saepe nam, velit enim voluptatem corporis earum dolorem eius sed ab, magnam doloribus?</div>
</body>
</html>
