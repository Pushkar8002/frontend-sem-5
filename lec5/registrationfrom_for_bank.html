<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
    </style>    
</head>

<body>

    <h2>Customer Registration Form</h2>

    <form action="#" method="post">

        <label for="name">Customer Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="dob">Customer Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="email">Customer Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="income">Customer Income:</label>
        <input type="number" id="income" name="income" required>
        <br><br>

        <label>Customer ID Proof:</label>
        <br>

        <input type="radio" id="aadhar" name="idproof" value="Aadhar" required>
        <label for="aadhar">Aadhar Card</label>

        <input type="radio" id="pan" name="idproof" value="PAN">
        <label for="pan">PAN Card</label>

        <input type="radio" id="voter" name="idproof" value="Voter">
        <label for="voter">Voter ID</label>

        <br><br>

        <label>Services Applied For:</label>
        <br>

        <input type="checkbox" id="account" name="service" value="account">
        <label for="account">Opening Account</label>
        <br>

        <input type="checkbox" id="education" name="service" value="education">
        <label for="education">Educational Loan</label>
        <br>

        <input type="checkbox" id="car" name="service" value="car">
        <label for="car">Car Loan</label>
        <br>

        <input type="checkbox" id="home" name="service" value="home">
        <label for="home">Home Loan</label>

        <br><br>

        <label for="address">Customer Address:</label>
        <br>

        <textarea id="address" name="address" rows="5" cols="40" required></textarea>

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
