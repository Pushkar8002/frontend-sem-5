<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Applicant Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            background-image: url("GU.jpg.jpeg");
            background-size: cover;
            background-position: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(192, 15, 15, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        fieldset {
            border: 2px solid #0f0d82;
            border-radius: 8px;
            margin-bottom: 25px;
            padding: 20px;
        }

        legend {
            font-size: 18px;
            font-weight: bold;
            padding: 0 10px;
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #333;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .radio-group label,
        .checkbox-group label {
            font-weight: normal;
            margin: 0;
        }

        .radio-group input,
        .checkbox-group input {
            width: auto;
            margin-right: 5px;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        .submit-btn {
            background-color: #333;
            color: white;
        }

        .reset-btn {
            background-color: #ddd;
            color: #333;
        }

        button:hover {
            opacity: 0.85;
        }

        .required {
            color: red;
        }

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Applicant Registration Form</h1>
    <p class="subtitle">Please fill in the details carefully</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">
                        First Name <span class="required">*</span>
                    </label>
                    <input type="text" id="firstName" name="firstName"
                           placeholder="Enter first name" required>
                </div>

                <div class="form-group">
                    <label for="lastName">
                        Last Name <span class="required">*</span>
                    </label>
                    <input type="text" id="lastName" name="lastName"
                           placeholder="Enter last name" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="dob">
                        Date of Birth <span class="required">*</span>
                    </label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label>Gender <span class="required">*</span></label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="male" required>
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="other">
                            Other
                        </label>
                    </div>
                </div>

            </div>

        </fieldset>


        <!-- Contact Information -->
        <fieldset>

            <legend>Contact Information</legend>

            <div class="form-row">

                <div class="form-group">
                    <label for="email">
                        Email Address <span class="required">*</span>
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="example@gmail.com"
                           required>
                </div>

                <div class="form-group">
                    <label for="phone">
                        Mobile Number <span class="required">*</span>
                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="Enter mobile number"
                           pattern="[0-9]{10}"
                           required>
                </div>

            </div>

        </fieldset>


        <!-- Course Information -->
        <fieldset>

            <legend>Course Information</legend>

            <div class="form-row">

                <div class="form-group">

                    <label for="course">
                        Select Course <span class="required">*</span>
                    </label>

                    <select id="course" name="course" required>

                        <option value="">-- Select Course --</option>
                        <option value="btech-cse">
                            B.Tech Computer Science and Engineering
                        </option>

                        <option value="btech-fsd">
                            B.Tech CSE - Full Stack Development
                        </option>

                        <option value="btech-ai">
                            B.Tech Artificial Intelligence
                        </option>

                        <option value="bca">
                            Bachelor of Computer Applications
                        </option>

                        <option value="mca">
                            Master of Computer Applications
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="qualification">
                        Highest Qualification
                    </label>

                    <select id="qualification" name="qualification">

                        <option value="">-- Select --</option>
                        <option value="10th">10th</option>
                        <option value="12th">12th</option>
                        <option value="diploma">Diploma</option>
                        <option value="graduation">Graduation</option>
                        <option value="postgraduation">
                            Post Graduation
                        </option>

                    </select>

                </div>

            </div>

        </fieldset>


        <!-- Address -->
        <fieldset>

            <legend>Address</legend>

            <div class="form-group">

                <label for="address">
                    Address <span class="required">*</span>
                </label>

                <textarea id="address"
                          name="address"
                          placeholder="Enter your complete address"
                          required></textarea>

            </div>

            <br>

            <div class="form-row">

                <div class="form-group">

                    <label for="city">City</label>

                    <input type="text"
                           id="city"
                           name="city"
                           placeholder="Enter city">

                </div>

                <div class="form-group">

                    <label for="state">State</label>

                    <input type="text"
                           id="state"
                           name="state"
                           placeholder="Enter state">

                </div>

                <div class="form-group">

                    <label for="pincode">PIN Code</label>

                    <input type="text"
                           id="pincode"
                           name="pincode"
                           placeholder="Enter PIN code"
                           pattern="[0-9]{6}">

                </div>

            </div>

        </fieldset>


        <!-- Documents -->
        <fieldset>

            <legend>Document Upload</legend>

            <div class="form-row">

                <div class="form-group">

                    <label for="photo">
                        Applicant Photo
                    </label>

                    <input type="file"
                           id="photo"
                           name="photo"
                           accept="image/*">

                </div>

                <div class="form-group">

                    <label for="document">
                        Qualification Document
                    </label>

                    <input type="file"
                           id="document"
                           name="document"
                           accept=".pdf,.jpg,.jpeg,.png">

                </div>

            </div>

        </fieldset>


        <!-- Declaration -->
        <fieldset>

            <legend>Declaration</legend>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox"
                           name="declaration"
                           required>

                    I hereby declare that the information provided
                    by me is correct and complete.
                </label>

            </div>

        </fieldset>


        <!-- Buttons -->
        <div class="buttons">

            <button type="submit" class="submit-btn">
                Register
            </button>

            <button type="reset" class="reset-btn">
                Reset
            </button>

        </div>

    </form>

</div>

</body>
</html>
```
