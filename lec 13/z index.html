<!DOCTYPE html>
<html>
<head>
    <title>Z-Index Example</title>

    <style>
        .box1 {
            width: 150px;
            height: 150px;
            background-color: red;
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 1;
        }

        .box2 {
            width: 150px;
            height: 150px;
            background-color: blue;
            position: absolute;
            top: 100px;
            left: 100px;
            z-index: 2;
        }

        .box3 {
            width: 150px;
            height: 150px;
            background-color: green;
            position: absolute;
            top: 150px;
            left: 150px;
            z-index: 3;
        }
    </style>
</head>

<body>

    <h2>Z-Index Example</h2>

    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
    <div class="box3">Box 3</div>

</body>
</html>
