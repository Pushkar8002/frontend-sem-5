<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop in js
    </title>
</head>
<body>
    <h1>for loop</h1>

    <div id="result"></div>

    <script>
        let table = "<table border='1'><tr><th>Multiplication</th><th>Result</th></tr>";

        for (let i = 1; i <= 10; i++) {
            table += "<tr><td>5 x " + i + "</td><td>" + (5 * i) + "</td></tr>";
        }

        table += "</table>";
        document.getElementById("result").innerHTML = table;
    </script>
</body>
</html>
